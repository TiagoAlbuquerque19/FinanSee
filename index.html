<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Para instalar na tela inicial do celular -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="FinanSee" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Cor da barra do navegador no celular, em cada tema -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#161921"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FinanSee: controle de gastos, receitas e metas por mês."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>FinanSee</title>
    <script>
      // Aplica o tema antes do React carregar, para a tela não "piscar"
      // branca quando o tema salvo é o escuro
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("tema");
        } catch (erro) {}
        if (tema !== "claro" && tema !== "escuro") {
          // Nunca escolheu? Segue o tema do sistema (celular/computador)
          var sistemaEscuro = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          tema = sistemaEscuro ? "escuro" : "claro";
        }
        document.documentElement.dataset.tema = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
